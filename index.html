<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="마이 플래너">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="마이 플래너">
    <meta name="theme-color" content="#4f46e5">
    <meta name="format-detection" content="telephone=no">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect width='120' height='120' rx='28' fill='%234f46e5'/%3E%3Crect x='24' y='30' width='72' height='66' rx='12' fill='none' stroke='%23ffffff' stroke-width='7'/%3E%3Cline x1='24' y1='48' x2='96' y2='48' stroke='%23ffffff' stroke-width='7'/%3E%3Cline x1='42' y1='20' x2='42' y2='34' stroke='%23ffffff' stroke-width='7' stroke-linecap='round'/%3E%3Cline x1='78' y1='20' x2='78' y2='34' stroke='%23ffffff' stroke-width='7' stroke-linecap='round'/%3E%3Ccircle cx='46' cy='66' r='5' fill='%2334d399'/%3E%3Ccircle cx='60' cy='66' r='5' fill='%23fbbf24'/%3E%3Ccircle cx='74' cy='66' r='5' fill='%23ffffff'/%3E%3C/svg%3E">
    <title>마이 플래너 - 완전 오프라인 모바일 일정 관리 앱</title>
    <style>
        *, ::before, ::after { box-sizing: border-box; border-width: 0; border-style: solid; border-color: #e2e8f0; -webkit-tap-highlight-color: transparent; }
        html { line-height: 1.5; -webkit-text-size-adjust: 100%; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", system-ui, Roboto, sans-serif; }
        body { margin: 0; padding: 0; line-height: inherit; background-color: #0f172a; color: #1e293b; overscroll-behavior-y: none; }
        h1, h2, h3, h4, h5, h6, p { margin: 0; font-size: inherit; font-weight: inherit; }
        button, input, optgroup, select, textarea { font-family: inherit; font-size: 100%; font-weight: inherit; line-height: inherit; color: inherit; margin: 0; padding: 0; background-color: transparent; }
        button, select { text-transform: none; }
        button, [type='button'], [type='reset'], [type='submit'] { -webkit-appearance: button; cursor: pointer; }
        img, svg, video, canvas { display: block; vertical-align: middle; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .fade-in { animation: fadeIn 0.18s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
        .slide-up { animation: slideUp 0.22s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .has-custom-bg .glass-panel { background-color: rgba(255, 255, 255, var(--card-Alpha, 0.88)) !important; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
        .hidden { display: none !important; }
        .flex { display: flex; } .grid { display: grid; } .relative { position: relative; } .absolute { position: absolute; }
        .flex-col { flex-direction: column; } .flex-1 { flex: 1 1 0%; } .items-center { align-items: center; } .justify-between { justify-content: space-between; }
        .grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid-cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); } .grid-cols-7 { grid-template-columns: repeat(7, minmax(0, 1fr)); }
        .w-full { width: 100%; } .max-w-[430px] { max-width: 430px; } .h-[100dvh] { height: 100vh; height: 100dvh; }
        .p-1 { padding: 0.25rem; } .p-2 { padding: 0.5rem; } .p-3 { padding: 0.75rem; } .p-3\.5 { padding: 0.875rem; } .p-4 { padding: 1rem; }
        .px-2 { padding-left: 0.5rem; padding-right: 0.5rem; } .px-2\.5 { padding-left: 0.625rem; padding-right: 0.625rem; } .px-3 { padding-left: 0.75rem; padding-right: 0.75rem; }
        .py-1\.5 { padding-top: 0.375rem; padding-bottom: 0.375rem; } .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; } .py-2\.5 { padding-top: 0.625rem; padding-bottom: 0.625rem; }
        .text-xs { font-size: 0.75rem; } .text-sm { font-size: 0.875rem; } .text-base { font-size: 1rem; } .text-lg { font-size: 1.125rem; }
        .font-bold { font-weight: 700; } .font-extrabold { font-weight: 800; } .font-black { font-weight: 900; }
        .text-white { color: #ffffff; } .text-slate-400 { color: #94a3b8; } .text-slate-600 { color: #475569; } .text-slate-800 { color: #1e293b; } .text-slate-900 { color: #0f172a; }
        .bg-white { background-color: #ffffff; } .bg-slate-50 { background-color: #f8fafc; } .bg-slate-100 { background-color: #f1f5f9; } .bg-slate-900 { background-color: #0f172a; } .bg-indigo-600 { background-color: #4f46e5; }
        .rounded-xl { border-radius: 0.75rem; } .rounded-2xl { border-radius: 1rem; } .rounded-t-3xl { border-top-left-radius: 1.5rem; border-top-right-radius: 1.5rem; } .rounded-full { border-radius: 9999px; }
        .border { border-width: 1px; } .border-slate-200 { border-color: #e2e8f0; }
        .shadow-2xl { box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); }
        .transition { transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes bellRing { 0%, 100% { transform: rotate(0deg) scale(1); } 15% { transform: rotate(16deg) scale(1.08); } 30% { transform: rotate(-14deg) scale(1.08); } }
        .bell-ringing { animation: bellRing 0.9s ease-in-out infinite; }
    </style>
</head>
<body class="flex justify-center items-start min-h-screen bg-slate-900 text-slate-800 select-none">
    <div id="app-shell" class="w-full max-w-[430px] h-[100dvh] bg-slate-50 flex flex-col shadow-2xl relative overflow-hidden sm:border-x sm:border-slate-800">
        <div id="app-bg-image-layer" class="pointer-events-none absolute inset-0 bg-cover bg-center bg-no-repeat transition-opacity duration-300 z-0 hidden"></div>
        <div id="app-bg-overlay-layer" class="pointer-events-none absolute inset-0 transition-all duration-200 z-0 hidden"></div>
        
        <header id="app-header" class="relative bg-white border-b border-slate-200 px-4 pt-3 pb-2.5 shrink-0 z-20 shadow-sm overflow-hidden transition-all">
            <div id="header-bg-image-layer" class="pointer-events-none absolute inset-0 bg-cover bg-center bg-no-repeat z-0 hidden"></div>
            <div id="header-bg-overlay-layer" class="pointer-events-none absolute inset-0 bg-gradient-to-b from-slate-900/55 via-slate-900/40 to-slate-900/65 z-0 hidden"></div>
            <div class="relative z-10">
                <div class="flex items-center justify-between gap-2 mb-1">
                    <div class="flex items-center gap-2 min-w-0 shrink-0">
                        <div class="w-8 h-8 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-sm shrink-0">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                        </div>
                        <h1 id="header-app-title" class="text-base font-extrabold tracking-tight text-slate-900 leading-none whitespace-nowrap">마이 플래너</h1>
                    </div>
                    <div class="flex items-center gap-1.5 shrink-0">
                        <button id="btn-open-source-modal-top" onclick="openSourceCodeModal()" class="px-2.5 py-1.5 rounded-lg text-[11px] font-bold bg-slate-900 text-white hover:bg-slate-800 active:scale-95 transition whitespace-nowrap flex items-center gap-1 shadow-xs"><span>📋</span> <span>전체 코드 복사</span></button>
                        <button id="btn-sample-data" onclick="insertSampleData()" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 active:scale-95 transition whitespace-nowrap">샘플</button>
                        <button id="btn-today" onclick="goToToday()" class="px-2.5 py-1.5 rounded-lg text-xs font-bold bg-indigo-50 text-indigo-600 hover:bg-indigo-100 active:scale-95 transition whitespace-nowrap">오늘</button>
                    </div>
                </div>
                <p id="header-subtitle" class="w-full text-[11px] text-slate-400 font-medium truncate mb-2 px-1">저장소: 내부저장소 (마이플래너_백업데이터)</p>
                <div class="grid grid-cols-4 gap-1.5 mb-2">
                    <button onclick="openStorageModal()" class="py-1.5 px-1 rounded-xl text-[11px] font-bold bg-cyan-50 text-cyan-700 border border-cyan-200 hover:bg-cyan-100 active:scale-95 transition flex items-center justify-center gap-1 whitespace-nowrap"><span>📁</span> <span>저장경로</span></button>
                    <button onclick="openAlarmSettingsModal()" class="py-1.5 px-1 rounded-xl text-[11px] font-bold bg-amber-50 text-amber-700 border border-amber-200 hover:bg-amber-100 active:scale-95 transition flex items-center justify-center gap-1 whitespace-nowrap"><span>🔔</span> <span id="header-alarm-btn-text">알람</span></button>
                    <button onclick="openThemeModal()" class="py-1.5 px-1 rounded-xl text-[11px] font-bold bg-pink-50 text-pink-600 border border-pink-200 hover:bg-pink-100 active:scale-95 transition flex items-center justify-center gap-1 whitespace-nowrap"><span>🎨</span> <span>꾸미기</span></button>
                    <button onclick="openBackupModal('backup')" class="py-1.5 px-1 rounded-xl text-[11px] font-bold bg-emerald-50 text-emerald-700 border border-emerald-200 hover:bg-emerald-100 active:scale-95 transition flex items-center justify-center gap-1 whitespace-nowrap"><span>💾</span> <span>백업/복원</span></button>
                </div>
                <div class="flex items-center justify-between py-1 mb-2">
                    <button onclick="navigatePeriod(-1)" class="w-9 h-9 rounded-full flex items-center justify-center text-slate-600 hover:bg-slate-100 active:bg-slate-200 transition"><svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg></button>
                    <div class="text-center">
                        <h2 id="current-period-label" class="text-lg font-extrabold text-slate-900 tracking-tight">2026년 10월</h2>
                        <p id="current-period-sublabel" class="text-[11px] text-slate-400 font-medium hidden"></p>
                    </div>
                    <button onclick="navigatePeriod(1)" class="w-9 h-9 rounded-full flex items-center justify-center text-slate-600 hover:bg-slate-100 active:bg-slate-200 transition"><svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg></button>
                </div>
                <nav class="grid grid-cols-4 gap-1 bg-slate-100/90 p-1 rounded-xl">
                    <button onclick="switchView('year')" id="tab-year" class="view-tab py-1.5 text-xs font-semibold rounded-lg transition-all text-slate-500">년</button>
                    <button onclick="switchView('month')" id="tab-month" class="view-tab py-1.5 text-xs font-bold rounded-lg transition-all bg-white text-indigo-600 shadow-sm">월</button>
                    <button onclick="switchView('week')" id="tab-week" class="view-tab py-1.5 text-xs font-semibold rounded-lg transition-all text-slate-500">주</button>
                    <button onclick="switchView('day')" id="tab-day" class="view-tab py-1.5 text-xs font-semibold rounded-lg transition-all text-slate-500">일</button>
                </nav>
            </div>
        </header>

        <main id="main-scroll-area" class="relative z-10 flex-1 overflow-y-auto no-scrollbar pb-24">
            <section id="view-month" class="fade-in">
                <div class="bg-white border-b border-slate-200 px-3 pt-2 pb-3 shadow-xs">
                    <div class="grid grid-cols-7 text-center mb-1">
                        <div class="text-[11px] font-bold text-rose-500 py-1">일</div>
                        <div class="text-[11px] font-bold text-slate-500 py-1">월</div>
                        <div class="text-[11px] font-bold text-slate-500 py-1">화</div>
                        <div class="text-[11px] font-bold text-slate-500 py-1">수</div>
                        <div class="text-[11px] font-bold text-slate-500 py-1">목</div>
                        <div class="text-[11px] font-bold text-slate-500 py-1">금</div>
                        <div class="text-[11px] font-bold text-blue-500 py-1">토</div>
                    </div>
                    <div id="month-calendar-grid" class="grid grid-cols-7 gap-1 text-center"></div>
                </div>
                <div class="p-3.5">
                    <div class="flex items-center justify-between mb-2.5">
                        <div class="flex items-center gap-2">
                            <h3 id="month-selected-date-title" class="text-sm font-extrabold text-slate-900">날짜 선택</h3>
                            <span id="month-selected-date-badge" class="px-2 py-0.5 text-[11px] font-semibold rounded-full bg-indigo-50 text-indigo-600">0개 일정</span>
                        </div>
                    </div>
                    <form onsubmit="handleQuickAdd(event)" class="flex gap-1.5 mb-3">
                        <input type="text" id="quick-add-input" placeholder="선택한 날짜에 빠른 일정 추가..." class="flex-1 bg-white border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm text-slate-800 focus:outline-none focus:border-indigo-500">
                        <button type="submit" class="px-3.5 py-2.5 bg-indigo-600 text-white rounded-xl text-xs font-bold shrink-0">추가</button>
                    </form>
                    <div id="month-day-schedule-list" class="space-y-2">
                        <div class="bg-white rounded-2xl border border-slate-200/80 p-6 text-center">
                            <p class="text-xs font-semibold text-slate-500">등록된 일정이 없습니다.</p>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        const STORAGE_KEY = 'MOBILE_SCHEDULE_APP_STAGE1_DATA';
        const state = {
            currentView: 'month',
            selectedDate: new Date().toISOString().split('T')[0],
            displayYear: new Date().getFullYear(),
            displayMonth: new Date().getMonth(),
            schedules: []
        };

        function loadFromStorage() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) state.schedules = JSON.parse(raw);
            } catch (e) { state.schedules = []; }
        }

        function saveToStorage() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state.schedules));
            } catch (e) {}
        }

        function getTodayStr() {
            const now = new Date();
            return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
        }

        function getSchedulesForDate(dateStr) {
            return state.schedules.filter(item => item.date === dateStr);
        }

        function renderMonthView() {
            const gridEl = document.getElementById('month-calendar-grid');
            gridEl.innerHTML = '';
            const year = state.displayYear;
            const month = state.displayMonth;
            const todayStr = getTodayStr();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const firstDayOfWeek = new Date(year, month, 1).getDay();

            for (let i = 0; i < firstDayOfWeek; i++) {
                const emptyCell = document.createElement('div');
                gridEl.appendChild(emptyCell);
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const mStr = String(month + 1).padStart(2, '0');
                const dStr = String(day).padStart(2, '0');
                const dateStr = `${year}-${mStr}-${dStr}`;
                const isSelected = dateStr === state.selectedDate;
                const isToday = dateStr === todayStr;

                const btn = document.createElement('button');
                btn.type = 'button';
                btn.onclick = () => { state.selectedDate = dateStr; renderMonthView(); };
                btn.className = `py-2 rounded-xl text-xs font-bold transition ${isSelected ? 'bg-indigo-600 text-white' : isToday ? 'bg-indigo-50 text-indigo-700' : 'hover:bg-slate-100 text-slate-700'}`;
                btn.textContent = day;
                gridEl.appendChild(btn);
            }

            const daySchedules = getSchedulesForDate(state.selectedDate);
            document.getElementById('month-selected-date-title').textContent = state.selectedDate;
            document.getElementById('month-selected-date-badge').textContent = `${daySchedules.length}개 일정`;
            
            const listContainer = document.getElementById('month-day-schedule-list');
            listContainer.innerHTML = daySchedules.length === 0 ? 
                '<div class="bg-white rounded-2xl border p-6 text-center"><p class="text-xs text-slate-500">등록된 일정이 없습니다.</p></div>' :
                daySchedules.map(s => `<div class="bg-white p-3 rounded-xl border flex justify-between items-center"><span class="text-sm font-bold">${s.title}</span></div>`).join('');
        }

        function handleQuickAdd(e) {
            e.preventDefault();
            const input = document.getElementById('quick-add-input');
            const title = input.value.trim();
            if (!title) return;
            state.schedules.push({ id: Date.now(), title, date: state.selectedDate, status: 'pending' });
            saveToStorage();
            input.value = '';
            renderMonthView();
        }

        function insertSampleData() {
            state.schedules.push({ id: Date.now(), title: '샘플 일정입니다!', date: state.selectedDate, status: 'pending' });
            saveToStorage();
            renderMonthView();
        }

        function goToToday() {
            const today = new Date();
            state.selectedDate = getTodayStr();
            state.displayYear = today.getFullYear();
            state.displayMonth = today.getMonth();
            renderMonthView();
        }

        function navigatePeriod(dir) {
            state.displayMonth += dir;
            if (state.displayMonth > 11) { state.displayMonth = 0; state.displayYear++; }
            else if (state.displayMonth < 0) { state.displayMonth = 11; state.displayYear--; }
            document.getElementById('current-period-label').textContent = `${state.displayYear}년 ${state.displayMonth + 1}월`;
            renderMonthView();
        }

        function switchView(view) {
            ['year', 'month', 'week', 'day'].forEach(v => {
                document.getElementById(`tab-${v}`).className = v === view ? 
                    'view-tab py-1.5 text-xs font-bold rounded-lg transition-all bg-white text-indigo-600 shadow-sm' : 
                    'view-tab py-1.5 text-xs font-semibold rounded-lg transition-all text-slate-500';
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadFromStorage();
            goToToday();
        });
    </script>
</body>
</html>
