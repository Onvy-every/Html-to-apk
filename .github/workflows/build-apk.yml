name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java JDK 21 설정
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 웹 파일 준비 및 Capacitor 안드로이드 프로젝트 구성
        run: |
          mkdir -p www
          cp Mylpanner.html www/index.html || cp *.html www/index.html || true
          cp -r css js images assets www/ 2>/dev/null || true

          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.myapp.htmlview",
            "appName": "MyHTMLApp",
            "webDir": "www"
          }
          EOF

          npx cap add android

      - name: APK 컴파일 (Gradle Build)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 완성된 APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
