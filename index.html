<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>마이 플래너 - 오프라인 모바일 일정 관리 앱</title>
    <style>
        /* 기본 리셋 및 모바일 최적화 스타일 */
        *, ::before, ::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif; background-color: #0f172a; color: #1e293b; display: flex; justify-content: center; align-items: start; min-height: 100vh; }
        #app-shell { width: 100%; max-width: 430px; height: 100vh; height: 100dvh; bg-slate-50; background-color: #f8fafc; display: flex; flex-direction: column; position: relative; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); }
        header { background-color: #ffffff; border-bottom: 1px solid #e2e8f0; padding: 1rem; }
        main { flex: 1; overflow-y: auto; padding: 1rem; }
        button { cursor: pointer; background: none; border: none; font-family: inherit; }
        .btn-primary { background-color: #4f46e5; color: white; padding: 0.5rem 1rem; border-radius: 0.5rem; font-weight: bold; }
        .schedule-card { background: white; border: 1px solid #e2e8f0; border-radius: 0.75rem; padding: 0.75rem; margin-bottom: 0.5rem; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>
    <div id="app-shell">
        <header style="display: flex; justify-content: space-between; align-items: center;">
            <h1 style="font-size: 1.15rem; font-weight: 800; color: #0f172a;">📅 마이 플래너</h1>
            <button class="btn-primary" onclick="addSampleSchedule()">+ 샘플 추가</button>
        </header>
        <main>
            <div id="schedule-list" style="margin-top: 1rem;">
                <!-- 일정이 동적으로 표시되는 영역 -->
            </div>
        </main>
    </div>

    <script>
        let schedules = JSON.parse(localStorage.getItem('MY_PLANNER_DATA') || '[]');

        function saveSchedules() {
            localStorage.setItem('MY_PLANNER_DATA', JSON.stringify(schedules));
            renderSchedules();
        }

        function addSampleSchedule() {
            const newTitle = prompt('추가할 일정 제목을 입력하세요:', '중요 미팅 및 업무 처리');
            if (!newTitle) return;
            schedules.push({
                id: Date.now(),
                title: newTitle,
                date: new Date().toISOString().split('T')[0],
                completed: false
            });
            saveSchedules();
        }

        function toggleComplete(id) {
            schedules = schedules.map(s => s.id === id ? { ...s, completed: !s.completed } : s);
            saveSchedules();
        }

        function renderSchedules() {
            const listEl = document.getElementById('schedule-list');
            if (schedules.length === 0) {
                listEl.innerHTML = '<p style="text-align: center; color: #94a3b8; font-size: 0.875rem; margin-top: 2rem;">등록된 일정이 없습니다. 상단 버튼을 눌러 추가해 보세요!</p>';
                return;
            }
            listEl.innerHTML = schedules.map(s => `
                <div class="schedule-card" style="opacity: ${s.completed ? 0.6 : 1};">
                    <div>
                        <p style="font-size: 0.9rem; font-weight: bold; text-decoration: ${s.completed ? 'line-through' : 'none'};">${s.title}</p>
                        <p style="font-size: 0.75rem; color: #64748b;">날짜: ${s.date}</p>
                    </div>
                    <button onclick="toggleComplete(${s.id})" style="padding: 0.25rem 0.5rem; background: ${s.completed ? '#10b981' : '#e2e8f0'}; color: ${s.completed ? 'white' : '#334155'}; border-radius: 0.375rem; font-size: 0.75rem; font-weight: bold;">
                        ${s.completed ? '완료됨' : '대기중'}
                    </button>
                </div>
            `).join('');
        }

        renderSchedules();
    </script>
</body>
</html>
